[project]
name = "sts2cli"
version = "0.1.0"
description = "CLI adapter for controlling the real Steam STS2 client via a local bridge plugin"
requires-python = ">=3.10"

[project.scripts]
sts2 = "sts2cli.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
